---
- name: Gather shop facts
  hosts: webstore_shop
  gather_facts: true

- name: Point webapp01 at the full gcomm list and start webapp02
  hosts: webstore_shop
  become: true
  vars:
    galera_bootstrap: false
  tasks:
    - name: Addresses
      ansible.builtin.set_fact:
        webapp01_ip: "{{ hostvars['webapp01.lab.rippa.io'].ansible_default_ipv4.address }}"
        webapp02_ip: "{{ hostvars['webapp02.lab.rippa.io'].ansible_default_ipv4.address }}"
    - name: Read MariaDB root password
      ansible.builtin.command: awk -F= '/^MARIADB_ROOT_PASSWORD=/ {print substr($0, index($0,$2))}' /etc/webstore/webstore.env
      register: mariadb_pw
      changed_when: false
    - name: Template running Galera config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../deploy/galera/galera.cnf.j2"
        dest: /etc/webstore/galera.cnf
        mode: "0600"
      vars:
        mariadb_root_password: "{{ mariadb_pw.stdout }}"
    - name: Start MariaDB on webapp02 (joins webapp01)
      ansible.builtin.systemd:
        name: webstore-mariadb.service
        state: started
        enabled: true
      when: inventory_hostname == 'webapp02.lab.rippa.io'

- name: Start garbd on ops
  hosts: webstore_ops
  become: true
  tasks:
    - name: Start Galera arbitrator
      ansible.builtin.systemd:
        name: webstore-garbd.service
        state: started
        enabled: true
